plugins { id 'com.android.application' }

android {
    namespace 'com.cet6.listening'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cet6.listening'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    androidResources {
        noCompress += ['mp3', 'm4a']
    }
}
